# cargo-deny: vulnerable, yanked, unlicensed or untrusted-source crates fail CI.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" notices fail only for crates we depend on directly;
# deep transitive ones (Tauri's GTK build macros, unic-*) are upstream's to replace.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.93
# GPL-3.0-compatible licenses only.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSL-1.0",
  "BSD-3-Clause",
  "CC0-1.0",
  # Mozilla's root-certificate data (webpki-roots), used by the desktop app's HTTP client.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
