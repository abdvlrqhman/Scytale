name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Desktop app build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      # The extension runs the core as WASM.
      - run: cargo clippy -p scytale-core-wasm --target wasm32-unknown-unknown --locked

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: scripts/install-wasm-bindgen.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:wasm
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm --filter @scytale/ui run build
      - name: Extension end-to-end tests (Chromium)
        run: |
          pnpm --filter @scytale/extension exec playwright install --with-deps chromium
          pnpm --filter @scytale/extension run e2e
      - name: Reproducible build (what Firefox's reviewers check)
        run: |
          pnpm --filter @scytale/extension run build:firefox
          cp -r apps/extension/.output/firefox-mv3 "$RUNNER_TEMP/first"
          cargo clean -p scytale-core-wasm --release --target wasm32-unknown-unknown
          rm -rf apps/extension/.output packages/core-wasm/pkg
          pnpm run build:wasm
          pnpm --filter @scytale/extension run build:firefox
          diff -r "$RUNNER_TEMP/first" apps/extension/.output/firefox-mv3 && echo "Identical builds."

  crypto-crosscheck:
    # Re-derives tests/vectors/chain.json with libsodium, argon2-cffi and pyca/cryptography.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -r crates/core/tests/vectors/requirements.txt
      - run: python crates/core/tests/vectors/crosscheck.py

  cargo-deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
