[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/abdvlrqhman/Scytale"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# Argon2 is unusably slow unoptimized; optimize dependencies even in dev/test builds.
[profile.dev.package."*"]
opt-level = 3
