[package]
name = "scytale-core"
version = "0.0.0"
description = "Scytale vault core: crypto, vault format and sync merge. Pure, no I/O."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
csv = "1.4"
hkdf = "0.13"
hmac = "0.13"
psl = "2"
rand_core = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
unicode-normalization = "0.1"
url = "2.5"
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
proptest = "1.11"
rand_chacha = "0.10"
