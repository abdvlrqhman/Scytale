[package]
name = "scytale-core-wasm"
version = "0.0.0"
description = "WebAssembly bindings of scytale-core for the browser extension."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
scytale-core = { path = "../core" }
# Must equal the wasm-bindgen CLI version exactly (see scripts/build-wasm.mjs).
wasm-bindgen = "=0.2.129"
getrandom = { version = "0.4", features = ["sys_rng"] }
rand_core = "0.10"
serde = "1"
serde_json = "1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
