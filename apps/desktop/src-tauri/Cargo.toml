[package]
name = "scytale-desktop"
version = "1.0.1"
description = "Scytale desktop app."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "scytale_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = ["isolation"] }

[dependencies]
scytale-core = { path = "../../../crates/core" }
tauri = { version = "2.12", features = ["tray-icon", "isolation"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-store = "2.5"
tauri-plugin-http = "2.8"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
keyring = "4.2"
getrandom = { version = "0.4", features = ["sys_rng"] }
rand_core = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[lints]
workspace = true
